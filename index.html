<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Syllabus Generator - Pinnacle Global School</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons for Subjects -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas Library for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            /* Rich Navy Blue adjusted for clear mobile screen rendering */
            --primary-blue: #0b255a;
            --accent-gold: #e5a720;
            --light-bg: #f4f7fc;
            --border-blue: #1c356e;
            --text-dark: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #eef2f5;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Controls Area */
        .controls-container {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        .controls-container label {
            font-weight: 700;
            color: var(--primary-blue);
            font-size: 14px;
        }

        .controls-container select {
            padding: 8px 12px;
            border: 2px solid var(--primary-blue);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            background: #fff;
            color: var(--primary-blue);
        }

        .btn-action {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 10px 18px;
            border: 2px solid var(--accent-gold);
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        /* Card Wrap for Canvas Render */
        .card-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        /* Printable / Exportable Syllabus Card */
        .syllabus-card {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 25px 20px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 6px solid #ffffff;
            outline: 2px solid var(--accent-gold);
            border-radius: 4px;
        }

        /* Header Layout */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px double var(--accent-gold);
            padding-bottom: 12px;
            margin-bottom: 15px;
            gap: 10px;
        }

        .header img.logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-grow: 1;
        }

        .exam-badge {
            background-color: var(--primary-blue) !important;
            color: #ffffff !important;
            padding: 3px 14px;
            border-radius: 15px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 4px;
            display: inline-block;
        }

        .school-name {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .motto {
            font-size: 9px;
            letter-spacing: 1px;
            color: #555;
            margin-top: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .session-badge {
            background-color: var(--accent-gold) !important;
            color: var(--primary-blue) !important;
            padding: 2px 10px;
            font-weight: 800;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 4px;
            display: inline-block;
        }

        /* Class Title Pill */
        .class-pill-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .class-pill {
            display: inline-block;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            font-size: 16px;
            font-weight: 800;
            padding: 3px 25px;
            border-radius: 20px;
            background: #f4f7fc;
            letter-spacing: 1px;
        }

        /* Table Design */
        .syllabus-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            table-layout: fixed;
        }

        .syllabus-table th {
            background-color: var(--primary-blue) !important;
            color: #ffffff !important;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 8px 10px;
            text-transform: uppercase;
            border: 1px solid var(--border-blue);
        }

        .syllabus-table th:first-child {
            width: 35%;
            text-align: left;
        }

        .syllabus-table th:last-child {
            width: 65%;
            text-align: left;
        }

        .syllabus-table td {
            padding: 8px 10px;
            border: 1px solid #dcdcdc;
            vertical-align: middle;
            font-size: 12.5px;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .subject-cell {
            background-color: var(--primary-blue) !important;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 12.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            width: 100%;
        }

        .subject-icon {
            width: 24px;
            height: 24px;
            background: #ffffff !important;
            color: var(--primary-blue) !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .syllabus-table tr:nth-child(even) td:last-child {
            background-color: #f8fafe;
        }

        .syllabus-table tr:nth-child(odd) td:last-child {
            background-color: #ffffff;
        }

        /* Footer */
        .footer {
            border-top: 2px solid var(--accent-gold);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .footer-tagline {
            font-family: 'Cinzel', serif;
            font-style: italic;
            font-weight: 700;
            color: var(--primary-blue);
            font-size: 11px;
        }

        .footer-sub {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Desktop sizing enhancements */
        @media (min-width: 600px) {
            .syllabus-card {
                padding: 35px 30px;
            }
            .header img.logo {
                width: 100px;
                height: 100px;
            }
            .school-name {
                font-size: 26px;
            }
            .exam-badge {
                font-size: 15px;
            }
            .class-pill {
                font-size: 19px;
            }
            .syllabus-table th {
                font-size: 14px;
            }
            .syllabus-table td {
                font-size: 13.5px;
            }
            .subject-cell {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- User Controls -->
    <div class="controls-container">
        <div>
            <label for="classSelect"><i class="fa-solid fa-graduation-cap"></i> Select Class: </label>
            <select id="classSelect" onchange="renderSyllabus()">
                <option value="">-- Loading Classes... --</option>
            </select>
        </div>
        <button class="btn-action" onclick="downloadImage()">
            <i class="fa-solid fa-image"></i> Download Syllabus Image
        </button>
    </div>

    <!-- Printable/Downloadable Area -->
    <div class="card-wrapper">
        <div class="syllabus-card" id="syllabusContainer">
            <div>
                <header class="header">
                    <img src="logo.png" alt="School Logo" class="logo" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
                    <div class="header-title-box">
                        <div class="exam-badge" id="examName">EXAMINATION</div>
                        <h1 class="school-name">PINNACLE GLOBAL SCHOOL</h1>
                        <div class="motto">Nurturing Minds • Shaping Futures</div>
                        <div class="session-badge" id="academicSession">SESSION ----</div>
                    </div>
                </header>

                <div class="class-pill-container">
                    <div class="class-pill" id="selectedClassLabel">CLASS - ---</div>
                </div>

                <!-- Dynamic Data Table -->
                <table class="syllabus-table">
                    <thead>
                        <tr>
                            <th><i class="fa-solid fa-book-open"></i> &nbsp;Subjects</th>
                            <th><i class="fa-solid fa-list-check"></i> &nbsp;Syllabus</th>
                        </tr>
                    </thead>
                    <tbody id="syllabusTableBody">
                        <tr>
                            <td colspan="2" style="text-align: center; padding: 30px; color: #888;">
                                Loading Syllabus Data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer-sub">Learn • Grow • Excel</div>
                <div class="footer-tagline">Together We Achieve More</div>
            </footer>
        </div>
    </div>

    <script>
        const SHEET_ID = '1MMF_UO24i3N7somcryvuz8-2VwIXeF4gcCloNMDRyxI';
        const GID = '1915322612';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

        let rawRows = [];
        let parsedClassData = {};
        let examName = "HALF YEARLY EXAMINATION";
        let session = "2026-27";

        const iconMap = {
            'HINDI': 'fa-language',
            'ENGLISH': 'fa-font',
            'MATHS': 'fa-calculator',
            'MATHEMATICS': 'fa-calculator',
            'SCIENCE': 'fa-flask',
            'EVS': 'fa-leaf',
            'S.ST': 'fa-landmark',
            'SOCIAL SCIENCE': 'fa-landmark',
            'COMPUTER': 'fa-laptop-code',
            'COMPUTERS': 'fa-laptop-code',
            'SANSKRIT': 'fa-book-atlas',
            'M.V.': 'fa-heart-pulse',
            'G.K.': 'fa-lightbulb',
            'DRAWING': 'fa-palette',
            'ART': 'fa-palette',
            'PHYSICS': 'fa-atom',
            'CHEMISTRY': 'fa-vial',
            'BIOLOGY': 'fa-dna',
            'ACCOUNTANCY': 'fa-file-invoice-dollar',
            'BUSINESS': 'fa-briefcase',
            'ECONOMICS': 'fa-chart-line'
        };

        // Fetch Google Sheet Data
        async function fetchSheetData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const jsonString = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
                const data = JSON.parse(jsonString);

                rawRows = data.table.rows;
                extractMetadata();
                parseSyllabusData();
                populateDropdown();
            } catch (error) {
                console.error("Error loading spreadsheet data:", error);
                document.getElementById('syllabusTableBody').innerHTML = `
                    <tr><td colspan="2" style="color:red; text-align:center;">Failed to fetch syllabus data. Ensure Google Sheet sharing is set to 'Anyone with link can view'.</td></tr>
                `;
            }
        }

        // Helper to safely get cell values
        function getCellVal(r, c) {
            if (rawRows[r] && rawRows[r].c && rawRows[r].c[c] && rawRows[r].c[c].v !== null && rawRows[r].c[c].v !== undefined) {
                return String(rawRows[r].c[c].v).trim();
            }
            return "";
        }

        // Extract metadata (B1: Exam, F1: Session)
        function extractMetadata() {
            const b1 = getCellVal(0, 1);
            const f1 = getCellVal(0, 5);
            if (b1) examName = b1;
            if (f1) session = f1;

            document.getElementById('examName').innerText = examName;
            document.getElementById('academicSession').innerText = session.toUpperCase().includes("SESSION") ? session : `ACADEMIC SESSION ${session}`;
        }

        // Parse Sheet Block by Block
        function parseSyllabusData() {
            parsedClassData = {};

            // Block 1: Nursery to 5th (Row 2 header, Rows 4 to 17 data -> Cols A-P / 0 to 15)
            parseBlock(1, 3, 16, 16); 

            // Block 2: 6th to 12th (Row 18 header, Rows 20 to 33 data -> Cols A-N / 0 to 13)
            parseBlock(17, 19, 32, 14); 
        }

        function parseBlock(classHeaderRowIdx, startRowIdx, endRowIdx, maxColIndex) {
            if (!rawRows[classHeaderRowIdx]) return;

            for (let c = 0; c < maxColIndex; c += 2) {
                let className = getCellVal(classHeaderRowIdx, c + 1) || getCellVal(classHeaderRowIdx, c);
                if (!className) continue;

                className = className.replace(/^CLASS[\s-:]*/i, '').trim();

                if (!parsedClassData[className]) {
                    parsedClassData[className] = [];
                }

                for (let r = startRowIdx; r <= endRowIdx; r++) {
                    const subject = getCellVal(r, c);
                    const syllabus = getCellVal(r, c + 1);

                    const subLower = subject.toLowerCase();
                    
                    // FILTER: Ignore blank rows AND structural sheet header titles like "Class", "Subject", "Syllabus"
                    if (
                        (subject !== "" || syllabus !== "") &&
                        !subLower.startsWith("class") &&
                        !subLower.startsWith("subject") &&
                        !subLower.startsWith("syllabus")
                    ) {
                        parsedClassData[className].push({
                            subject: subject,
                            syllabus: syllabus
                        });
                    }
                }
            }
        }

        // Populate Dropdown
        function populateDropdown() {
            const select = document.getElementById('classSelect');
            select.innerHTML = '';
            
            const classes = Object.keys(parsedClassData);
            if (classes.length === 0) {
                select.innerHTML = '<option value="">No Classes Found</option>';
                return;
            }

            classes.forEach((cls) => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.innerText = `Class ${cls}`;
                select.appendChild(opt);
            });

            select.selectedIndex = 0;
            renderSyllabus();
        }

        // Render Selected Class Table
        function renderSyllabus() {
            const selectedClass = document.getElementById('classSelect').value;
            const tbody = document.getElementById('syllabusTableBody');
            document.getElementById('selectedClassLabel').innerText = `CLASS - ${selectedClass.toUpperCase()}`;

            tbody.innerHTML = '';
            const items = parsedClassData[selectedClass] || [];

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 20px;">No syllabus details entered for this class.</td></tr>`;
                return;
            }

            items.forEach(item => {
                const cleanSub = item.subject.toUpperCase();
                let iconClass = 'fa-book';
                for (let key in iconMap) {
                    if (cleanSub.includes(key)) {
                        iconClass = iconMap[key];
                        break;
                    }
                }

                // Format Bullet Points properly
                let formattedSyllabus = item.syllabus
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => line.startsWith('•') || line.startsWith('-') ? line : `• ${line}`)
                    .join('\n');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="subject-cell">
                            <div class="subject-icon"><i class="fa-solid ${iconClass}"></i></div>
                            <span>${item.subject || '---'}</span>
                        </div>
                    </td>
                    <td>${formattedSyllabus}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Download PNG Image Fix for Mobile
        function downloadImage() {
            const container = document.getElementById('syllabusContainer');
            const selectedClass = document.getElementById('classSelect').value;

            // Use html2canvas with full scale scroll fix for mobile browsers
            html2canvas(container, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff",
                scrollX: 0,
                scrollY: 0,
                windowWidth: document.documentElement.offsetWidth
            }).then(canvas => {
                const imageURI = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                link.download = `Syllabus_Class_${selectedClass}.png`;
                link.href = imageURI;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                console.error("Failed to generate image:", err);
                alert("Failed to capture image. Please try again.");
            });
        }

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
