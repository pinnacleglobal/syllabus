<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinnacle Syllabus Portal</title>
  
  <link rel="icon" type="image/png" href="logo.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* Compact, fixed-width card tailored for standard mobile screen viewing & clean image downloads */
    #poster-area {
      width: 420px;
      height: fit-content;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fixed table styling: html2canvas respects this 100% without hiding/compressing text */
    .poster-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .poster-table th, .poster-table td {
      border: 1px solid #e2e8f0;
    }
    .col-subject-width {
      width: 145px;
    }
    .col-syllabus-width {
      width: 275px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 flex flex-col items-center">

  <!-- TOP CONTROLS -->
  <div class="w-full max-w-[420px] bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200 mb-3 flex items-center gap-2">
    <span class="text-xs font-bold text-slate-600 uppercase">Class:</span>
    <select id="classDropdown" onchange="renderPoster()" class="flex-grow border border-slate-300 rounded-lg p-1.5 bg-slate-50 font-bold text-slate-800 text-sm">
      <option value="Nursery">Nursery</option>
      <option value="LKG">LKG</option>
      <option value="UKG">UKG</option>
      <option value="1st">1st</option>
      <option value="2nd">2nd</option>
      <option value="3rd">3rd</option>
      <option value="4th">4th</option>
      <option value="5th">5th</option>
      <option value="6th">6th</option>
      <option value="7th">7th</option>
      <option value="8th">8th</option>
      <option value="9th">9th</option>
      <option value="10th">10th</option>
      <option value="11th">11th</option>
      <option value="12th">12th</option>
    </select>
    <button onclick="fetchSheetDataDirect()" title="Reload from Sheet" class="border border-[#072448] text-[#072448] px-2.5 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-50">
      <i class="fa-solid fa-rotate"></i>
    </button>
    <button onclick="downloadPNG()" class="bg-[#ff7b25] text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-orange-600 shadow flex items-center gap-1">
      <i class="fa-solid fa-download"></i> Save
    </button>
  </div>

  <!-- POSTER CARD -->
  <div id="poster-area" class="border-4 border-[#072448] rounded-3xl p-3.5 shadow-xl bg-white text-slate-800">
    
    <!-- HEADER -->
    <div class="flex flex-col items-center text-center">
      
      <!-- Big Logo -->
      <img src="logo.png" alt="Pinnacle School" class="w-24 h-24 object-contain mb-2 drop-shadow" onerror="this.style.display='none'"/>

      <!-- Class Badge -->
      <div class="w-full bg-[#0b5cbe] text-white rounded-xl py-1.5 shadow-sm text-center">
        <span id="txtClass" class="text-base font-black tracking-wider uppercase">Class : 7th</span>
      </div>

      <!-- Single-Line Exam Title -->
      <div class="w-full bg-[#d49e24] text-slate-900 rounded-lg py-1 px-2 mt-1.5 shadow-sm text-center">
        <div id="txtExam" class="font-black text-xs tracking-tight uppercase whitespace-nowrap overflow-hidden text-ellipsis">
          Syllabus : Half Yearly Examination
        </div>
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="w-full mt-3 border-2 border-[#072448] rounded-xl overflow-hidden shadow-sm">
      <table class="poster-table">
        <!-- Table Header -->
        <thead>
          <tr class="bg-[#072448] text-white text-xs font-bold uppercase tracking-wider">
            <th class="col-subject-width py-2 text-center border-r border-[#1a3a63]">
              <i class="fa-solid fa-book-bookmark text-amber-400 mr-1"></i> Subject
            </th>
            <th class="col-syllabus-width py-2 text-center">
              <i class="fa-solid fa-list-check text-amber-400 mr-1"></i> Syllabus
            </th>
          </tr>
        </thead>
        <!-- Table Body -->
        <tbody id="syllabusContainer" class="bg-white">
          <!-- Injected via JavaScript -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const SPREADSHEET_ID = "1MMF_UO24i3N7somcryvuz8-2VwIXeF4gcCloNMDRyxI";
    const SHEET_GID = "1915322612"; // Your exact Syllabus tab GID

    // Subject icon handler: circular 'अ' for Hindi, 'ABC' for English, 'सं' for Sanskrit
    function getSubjectIconHtml(subjectName) {
      const s = (subjectName || "").trim().toUpperCase();
      
      if (s === 'HINDI') {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] font-bold text-xs shrink-0 bg-slate-50">अ</div>`;
      }
      if (s === 'ENGLISH') {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] font-bold text-[9px] shrink-0 bg-slate-50">ABC</div>`;
      }
      if (s === 'SANSKRIT') {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] font-bold text-xs shrink-0 bg-slate-50">सं</div>`;
      }
      if (s.includes('MATH')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-calculator"></i></div>`;
      }
      if (s.includes('SCIENCE')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-flask"></i></div>`;
      }
      if (s.includes('S.ST') || s.includes('SOCIAL')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-landmark"></i></div>`;
      }
      if (s.includes('COMP')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-laptop"></i></div>`;
      }
      if (s.includes('G.K') || s.includes('GK')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-lightbulb"></i></div>`;
      }
      if (s.includes('DRAW') || s.includes('ART')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-palette"></i></div>`;
      }
      if (s.includes('M.V') || s.includes('VALUE')) {
        return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-heart"></i></div>`;
      }

      return `<div class="w-6 h-6 rounded-full border border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0 bg-slate-50"><i class="fa-solid fa-book"></i></div>`;
    }

    let parsedData = {
      examName: "Half Yearly Examination",
      classes: {}
    };

    // Google Visualization API JSONP Fetch (Bypasses all CORS and CSV publishing issues)
    function fetchSheetDataDirect() {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;

      fetch(gvizUrl)
        .then(res => res.text())
        .then(rawText => {
          // Clean the google wrapper: google.visualization.Query.setResponse(...)
          const jsonString = rawText.substring(rawText.indexOf("{"), rawText.lastIndexOf("}") + 1);
          const data = JSON.parse(jsonString);
          processGvizData(data.table);
        })
        .catch(err => {
          console.error("Direct fetch error:", err);
          renderPlaceholder();
        });
    }

    function processGvizData(table) {
      if (!table || !table.rows || table.rows.length === 0) return;

      // Extract Exam Name from Cell B1 (Row 0, Col 1)
      if (table.rows[0] && table.rows[0].c && table.rows[0].c[1]) {
        parsedData.examName = table.rows[0].c[1].v || "Half Yearly Examination";
      }

      parsedData.classes = {};

      // Helper function to safely read cell value
      const getVal = (r, c) => {
        if (table.rows[r] && table.rows[r].c && table.rows[r].c[c]) {
          return table.rows[r].c[c].v != null ? String(table.rows[r].c[c].v).trim() : "";
        }
        return "";
      };

      // Band 1: Nursery to 5th (Columns A to P -> 0 to 15, Class header Row 2 -> index 1, Data Rows 4 to 17 -> index 3 to 16)
      for (let col = 0; col <= 15; col += 2) {
        let className = getVal(1, col + 1);
        if (!className) continue;

        let subjectList = [];
        for (let r = 3; r <= 16 && r < table.rows.length; r++) {
          let subj = getVal(r, col);
          let syl = getVal(r, col + 1);
          if (subj !== "") {
            subjectList.push({ subject: subj, syllabus: syl });
          }
        }
        parsedData.classes[className] = subjectList;
      }

      // Band 2: 6th to 12th (Columns A to N -> 0 to 13, Class header Row 18 -> index 17, Data Rows 20 to 33 -> index 19 to 32)
      if (table.rows.length > 18) {
        for (let col = 0; col <= 13; col += 2) {
          let className = getVal(17, col + 1);
          if (!className) continue;

          let subjectList = [];
          for (let r = 19; r <= 32 && r < table.rows.length; r++) {
            let subj = getVal(r, col);
            let syl = getVal(r, col + 1);
            if (subj !== "") {
              subjectList.push({ subject: subj, syllabus: syl });
            }
          }
          parsedData.classes[className] = subjectList;
        }
      }

      renderPoster();
    }

    function renderPoster() {
      const cls = document.getElementById("classDropdown").value;
      document.getElementById("txtClass").innerText = "Class : " + cls;
      
      const examStr = "Syllabus : " + (parsedData.examName || "Half Yearly Examination");
      const examElem = document.getElementById("txtExam");
      examElem.innerText = examStr;

      const container = document.getElementById("syllabusContainer");
      container.innerHTML = "";

      // Match class case-insensitively or with suffixes (e.g. "7th" vs "7")
      let subjects = parsedData.classes[cls];
      if (!subjects) {
        const clean = cls.replace(/\D/g, '');
        const key = Object.keys(parsedData.classes).find(k => 
          k.toLowerCase() === cls.toLowerCase() || (clean && k.replace(/\D/g, '') === clean)
        );
        if (key) subjects = parsedData.classes[key];
      }

      if (!subjects || subjects.length === 0) {
        container.innerHTML = `
          <tr>
            <td colspan="2" class="p-4 text-center text-slate-400 font-medium text-xs">
              No entries found in Google Sheet for ${cls}.
            </td>
          </tr>`;
        return;
      }

      subjects.forEach(item => {
        const iconHtml = getSubjectIconHtml(item.subject);

        // Turn linebreaks into bullet points
        const bullets = item.syllabus
          .split('\n')
          .filter(l => l.trim() !== '')
          .map(l => `<div class="leading-tight mb-0.5">${l.startsWith('•') ? l : '• ' + l}</div>`)
          .join('');

        const row = `
          <tr class="hover:bg-slate-50">
            <!-- Subject Cell: Guaranteed width, icon + full name visible in one line -->
            <td class="col-subject-width p-2 align-middle bg-slate-50/50">
              <div class="flex items-center gap-1.5 overflow-hidden">
                ${iconHtml}
                <span class="font-extrabold text-[#072448] text-xs uppercase whitespace-nowrap overflow-hidden text-ellipsis">
                  ${item.subject}
                </span>
              </div>
            </td>
            <!-- Syllabus Cell: Expands naturally to fit all lines -->
            <td class="col-syllabus-width p-2 align-middle text-[11px] font-semibold text-slate-800">
              ${bullets || '—'}
            </td>
          </tr>
        `;
        container.innerHTML += row;
      });
    }

    function renderPlaceholder() {
      parsedData.classes["7th"] = [
        { subject: "English", syllabus: "Chapter 1 to 5 Reader\nGrammar: Nouns, Verbs, Tenses" },
        { subject: "Hindi", syllabus: "पाठ 1 से 6\nव्याकरण: संधि, समास" },
        { subject: "Maths", syllabus: "Ch 1: Integers\nCh 2: Fractions & Decimals" }
      ];
      renderPoster();
    }

    function downloadPNG() {
      const node = document.getElementById("poster-area");
      const cls = document.getElementById("classDropdown").value;

      html2canvas(node, {
        scale: 3,
        useCORS: true,
        backgroundColor: "#ffffff",
        scrollX: 0,
        scrollY: 0
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = `Syllabus_${cls}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    window.onload = fetchSheetDataDirect;
  </script>
</body>
</html>
