<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus - Pinnacle Global School</title>
    
    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- html2canvas Library for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --top-dark-blue: #093c85;
            --class-blue: #007bff;
            --gold-banner: #dca327;
            --table-header-blue: #0c3978;
            --row-alt-blue: #edf4ff;
            --border-color: #d1dbe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f2f4f8;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Controls Section */
        .controls-container {
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 450px;
        }

        .controls-container label {
            font-weight: 700;
            color: #0c3978;
            font-size: 14px;
        }

        .controls-container select {
            padding: 6px 10px;
            border: 1.5px solid #007bff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            background: #fff;
            color: #0c3978;
        }

        .btn-download {
            background-color: #0c3978;
            color: #ffffff;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-download:active {
            opacity: 0.8;
        }

        /* Main Card Layout (Matching uploaded picture) */
        .card-wrapper {
            width: 100%;
            max-width: 450px;
        }

        .syllabus-card {
            background: #ffffff;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        /* Header Blue Banner */
        .header-bg {
            background-color: var(--top-dark-blue);
            padding: 20px 15px 15px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bg img.logo {
            width: 120px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* Class Pill Box */
        .class-pill {
            background-color: var(--class-blue);
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            width: 100%;
            padding: 10px 0;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Main Body Padding */
        .card-content {
            padding: 12px;
        }

        /* Gold Banner */
        .gold-banner {
            background-color: var(--gold-banner);
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        /* Table Design */
        .syllabus-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            table-layout: fixed;
        }

        .syllabus-table th {
            background-color: var(--table-header-blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid var(--table-header-blue);
        }

        .syllabus-table th:first-child {
            width: 32%;
        }

        .syllabus-table th:last-child {
            width: 68%;
        }

        .syllabus-table td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
            line-height: 1.35;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .subject-td {
            font-weight: 700;
            color: #111111;
            text-align: center;
        }

        .syllabus-td {
            color: #222222;
            text-align: left;
        }

        .syllabus-table tr:nth-child(odd) td {
            background-color: #ffffff;
        }

        .syllabus-table tr:nth-child(even) td {
            background-color: var(--row-alt-blue);
        }
    </style>
</head>
<body>

    <!-- User Controls -->
    <div class="controls-container">
        <div>
            <label for="classSelect">Class: </label>
            <select id="classSelect" onchange="renderSyllabus()">
                <option value="">-- Loading... --</option>
            </select>
        </div>
        <button class="btn-download" onclick="downloadImage()">
            Download Image
        </button>
    </div>

    <!-- Syllabus Printable / Saveable Area -->
    <div class="card-wrapper">
        <div class="syllabus-card" id="syllabusContainer">
            
            <!-- Dark Blue Top Bar with Logo & Class -->
            <div class="header-bg">
                <img src="logo.png" alt="Pinnacle Global School Logo" class="logo" onerror="this.src='https://via.placeholder.com/120?text=PGS+LOGO'">
                <div class="class-pill" id="selectedClassLabel">Class : ---</div>
            </div>

            <!-- Content Area -->
            <div class="card-content">
                <!-- Gold Banner -->
                <div class="gold-banner" id="examBanner">Syllabus: Examination</div>

                <!-- Syllabus Table -->
                <table class="syllabus-table">
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Syllabus</th>
                        </tr>
                    </thead>
                    <tbody id="syllabusTableBody">
                        <tr>
                            <td colspan="2" style="text-align: center; padding: 20px; color: #666;">
                                Loading data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const SHEET_ID = '1MMF_UO24i3N7somcryvuz8-2VwIXeF4gcCloNMDRyxI';
        const GID = '1915322612';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

        let rawRows = [];
        let parsedClassData = {};
        let examName = "Half Yearly Examination";

        // Fetch Google Sheet Data
        async function fetchSheetData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const jsonString = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
                const data = JSON.parse(jsonString);

                rawRows = data.table.rows;
                extractMetadata();
                parseSyllabusData();
                populateDropdown();
            } catch (error) {
                console.error("Error loading spreadsheet data:", error);
                document.getElementById('syllabusTableBody').innerHTML = `
                    <tr><td colspan="2" style="color:red; text-align:center;">Failed to fetch syllabus data. Ensure sheet is published/public.</td></tr>
                `;
            }
        }

        // Helper to safely get cell text
        function getCellVal(r, c) {
            if (rawRows[r] && rawRows[r].c && rawRows[r].c[c] && rawRows[r].c[c].v !== null && rawRows[r].c[c].v !== undefined) {
                return String(rawRows[r].c[c].v).trim();
            }
            return "";
        }

        // Extract Metadata (B1: Exam Name)
        function extractMetadata() {
            const b1 = getCellVal(0, 1);
            if (b1) examName = b1;
            document.getElementById('examBanner').innerText = `Syllabus: ${examName}`;
        }

        // Parse Data Block by Block
        function parseSyllabusData() {
            parsedClassData = {};

            // Block 1: Nursery to 5th (Row 2 header -> Index 1, Data rows 4-17 -> Indices 3-16, Cols 0-15)
            parseBlock(1, 3, 16, 16); 

            // Block 2: 6th to 12th (Row 18 header -> Index 17, Data rows 20-33 -> Indices 19-32, Cols 0-13)
            parseBlock(17, 19, 32, 14); 
        }

        function parseBlock(classHeaderRowIdx, startRowIdx, endRowIdx, maxColIndex) {
            if (!rawRows[classHeaderRowIdx]) return;

            for (let c = 0; c < maxColIndex; c += 2) {
                let className = getCellVal(classHeaderRowIdx, c + 1) || getCellVal(classHeaderRowIdx, c);
                if (!className) continue;

                className = className.replace(/^CLASS[\s-:]*/i, '').trim();

                if (!parsedClassData[className]) {
                    parsedClassData[className] = [];
                }

                for (let r = startRowIdx; r <= endRowIdx; r++) {
                    const subject = getCellVal(r, c);
                    const syllabus = getCellVal(r, c + 1);
                    const subLower = subject.toLowerCase();

                    // Filter out structural header rows and blank rows
                    if (
                        (subject !== "" || syllabus !== "") &&
                        !subLower.startsWith("class") &&
                        !subLower.startsWith("subject") &&
                        !subLower.startsWith("syllabus")
                    ) {
                        parsedClassData[className].push({
                            subject: subject,
                            syllabus: syllabus
                        });
                    }
                }
            }
        }

        // Populate Class Dropdown
        function populateDropdown() {
            const select = document.getElementById('classSelect');
            select.innerHTML = '';
            
            const classes = Object.keys(parsedClassData);
            if (classes.length === 0) {
                select.innerHTML = '<option value="">No Classes Found</option>';
                return;
            }

            classes.forEach((cls) => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.innerText = `Class ${cls}`;
                select.appendChild(opt);
            });

            select.selectedIndex = 0;
            renderSyllabus();
        }

        // Render Table for Selected Class
        function renderSyllabus() {
            const selectedClass = document.getElementById('classSelect').value;
            const tbody = document.getElementById('syllabusTableBody');
            document.getElementById('selectedClassLabel').innerText = `Class : ${selectedClass}`;

            tbody.innerHTML = '';
            const items = parsedClassData[selectedClass] || [];

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No syllabus details entered.</td></tr>`;
                return;
            }

            items.forEach(item => {
                // Format bullets clean and tight
                let formattedSyllabus = item.syllabus
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => line.startsWith('•') || line.startsWith('-') ? line : `• ${line}`)
                    .join('\n');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="subject-td">${item.subject || '---'}</td>
                    <td class="syllabus-td">${formattedSyllabus}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Download PNG Image
        function downloadImage() {
            const container = document.getElementById('syllabusContainer');
            const selectedClass = document.getElementById('classSelect').value;

            html2canvas(container, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const imageURI = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                link.download = `Syllabus_Class_${selectedClass}.png`;
                link.href = imageURI;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                console.error("Image export failed:", err);
                alert("Could not generate image. Please try again.");
            });
        }

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
