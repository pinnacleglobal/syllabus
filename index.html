<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Global School - Syllabus & Date Sheet</title>
    
    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- html2canvas Library for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --top-dark-blue: #093c85;
            --class-blue: #007bff;
            --gold-banner: #dca327;
            --table-header-blue: #0c3978;
            --row-alt-blue: #edf4ff;
            --border-color: #d1dbe8;
            --section-header-bg: #3f4448;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f2f4f8;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Controls Section */
        .controls-container {
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 450px;
        }

        .view-toggle {
            display: flex;
            width: 100%;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .view-toggle button {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 13px;
            color: #0c3978;
            cursor: pointer;
            transition: 0.2s;
        }

        .view-toggle button.active {
            background: #0c3978;
            color: #fff;
        }

        .controls-container label {
            font-weight: 700;
            color: #0c3978;
            font-size: 14px;
        }

        .controls-container select {
            padding: 6px 10px;
            border: 1.5px solid #007bff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            background: #fff;
            color: #0c3978;
        }

        .btn-download {
            background-color: #0c3978;
            color: #ffffff;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-download:active {
            opacity: 0.8;
        }

        /* Main Card Layout */
        .card-wrapper {
            width: 100%;
            max-width: 450px;
        }

        .display-card {
            background: #ffffff;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        /* Header Blue Banner */
        .header-bg {
            background-color: var(--top-dark-blue);
            padding: 20px 15px 15px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bg img.logo {
            width: 120px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* Class Pill Box */
        .class-pill {
            background-color: var(--class-blue);
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            width: 100%;
            padding: 10px 0;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Main Body Padding */
        .card-content {
            padding: 12px;
        }

        /* Gold Banner */
        .gold-banner {
            background-color: var(--gold-banner);
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        /* Table Design */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            table-layout: fixed;
        }

        .data-table th {
            background-color: var(--table-header-blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid var(--table-header-blue);
        }

        .data-table th.col-left {
            width: 32%;
        }

        .data-table th.col-right {
            width: 68%;
        }

        .data-table td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
            line-height: 1.35;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .col-left-td {
            font-weight: 700;
            color: #111111;
            text-align: center;
        }

        .col-right-td {
            color: #222222;
            text-align: center;
        }

        .syllabus-mode .col-right-td {
            text-align: left;
            white-space: pre-wrap;
        }

        .data-table tr:nth-child(odd) td {
            background-color: #ffffff;
        }

        .data-table tr:nth-child(even) td {
            background-color: var(--row-alt-blue);
        }

        /* Minor/Major Header Rows */
        .data-table tr.section-header-row td {
            background-color: var(--section-header-bg) !important;
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            font-size: 13.5px;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            border: 1px solid var(--section-header-bg);
        }
    </style>
</head>
<body>

    <!-- User Controls -->
    <div class="controls-container">
        <div class="view-toggle">
            <button id="btnTabDatesheet" class="active" onclick="switchMode('datesheet')">Date Sheet</button>
            <button id="btnTabSyllabus" onclick="switchMode('syllabus')">Syllabus</button>
        </div>

        <div>
            <label for="classSelect">Class: </label>
            <select id="classSelect" onchange="renderCard()">
                <option value="">-- Loading... --</option>
            </select>
        </div>

        <button class="btn-download" onclick="downloadImage()">
            Download Image
        </button>
    </div>

    <!-- Printable / Download Area -->
    <div class="card-wrapper">
        <div class="display-card" id="cardContainer">
            
            <!-- Dark Blue Top Bar with Logo & Class -->
            <div class="header-bg">
                <img src="logo.png" alt="Pinnacle Global School Logo" class="logo" onerror="this.src='https://via.placeholder.com/120?text=PGS+LOGO'">
                <div class="class-pill" id="selectedClassLabel">Class : ---</div>
            </div>

            <!-- Content Area -->
            <div class="card-content" id="cardContent">
                <!-- Gold Banner -->
                <div class="gold-banner" id="bannerLabel">Loading...</div>

                <!-- Main Table -->
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th class="col-left" id="thCol1">Date</th>
                            <th class="col-right" id="thCol2">Subject</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="2" style="text-align: center; padding: 20px; color: #666;">
                                Loading data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const SHEET_ID = '1Sy5uBZkjKpGnLdZp2sFuhFORhO1fRqCswfNYHRl73PM';
        const GID = '1383668039';
        const SHEET_TAB_NAME = 'DS n Notice';

        let currentMode = 'datesheet';
        let matrix = [];
        let examNameDatesheet = "Examination";
        let examNameSyllabus = "Examination";
        let sessionYear = "";

        let parsedSyllabusData = {};
        let parsedDatesheetData = {};

        async function fetchSheetData() {
            const errorContainer = document.getElementById('tableBody');
            try {
                // Attempt 1: GViz endpoint
                const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB_NAME)}&headers=0`;
                const resp = await fetch(gvizUrl);
                const text = await resp.text();

                if (text.includes("google.visualization.Query.setResponse")) {
                    const jsonStr = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
                    const data = JSON.parse(jsonStr);

                    if (data.table && data.table.rows && data.table.rows.length > 0) {
                        matrix = data.table.rows.map(row => {
                            if (!row || !row.c) return [];
                            return row.c.map(cell => {
                                if (!cell) return "";
                                if (cell.f !== null && cell.f !== undefined && String(cell.f).trim() !== "") return String(cell.f).trim();
                                if (cell.v !== null && cell.v !== undefined && String(cell.v).trim() !== "") return String(cell.v).trim();
                                return "";
                            });
                        });
                    }
                }

                // Attempt 2: Fallback to direct CSV export
                if (!matrix || matrix.length < 15) {
                    console.warn("Switching to direct CSV fetch...");
                    const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
                    const csvResp = await fetch(csvUrl);
                    const csvText = await csvResp.text();
                    matrix = parseCSV(csvText);
                }

                if (!matrix || matrix.length === 0) {
                    throw new Error("Unable to retrieve sheet data.");
                }

                console.log(`Loaded spreadsheet with ${matrix.length} rows.`);

                extractHeaderMetadata();
                parseDateSheet();
                parseSyllabus();
                populateDropdown();

            } catch (err) {
                console.error("Data Load Error:", err);
                errorContainer.innerHTML = `
                    <tr><td colspan="2" style="color:red; text-align:center; padding: 20px;">
                        <b>Data Load Error:</b> ${err.message}<br>
                        <small>Check Console (F12) for detailed logs.</small>
                    </td></tr>
                `;
                document.getElementById('classSelect').innerHTML = '<option value="">No Classes Found</option>';
            }
        }

        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let curVal = '';
            let insideQuote = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"' && insideQuote && nextChar === '"') {
                    curVal += '"';
                    i++;
                } else if (char === '"') {
                    insideQuote = !insideQuote;
                } else if (char === ',' && !insideQuote) {
                    currentRow.push(curVal.trim());
                    curVal = '';
                } else if ((char === '\r' || char === '\n') && !insideQuote) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(curVal.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    curVal = '';
                } else {
                    curVal += char;
                }
            }
            if (curVal || currentRow.length > 0) {
                currentRow.push(curVal.trim());
                rows.push(currentRow);
            }
            return rows;
        }

        function getVal(r, c) {
            if (matrix[r] && matrix[r][c] !== undefined && matrix[r][c] !== null) {
                return String(matrix[r][c]).trim();
            }
            return "";
        }

        function cleanClassName(str) {
            return str.replace(/^CLASS[\s-:]*/i, '').trim();
        }

        function extractHeaderMetadata() {
            // Date Sheet Header (Row 1)
            const b1 = getVal(0, 1);
            if (b1) examNameDatesheet = b1;

            const f1 = getVal(0, 5);
            if (f1) sessionYear = f1;

            // Syllabus Header: Search dynamically for "Test/Exam Name" cell
            let foundSyllabusExam = false;
            for (let r = 20; r < matrix.length; r++) {
                const label = getVal(r, 0).toLowerCase();
                if (label.includes("test") || label.includes("exam name")) {
                    examNameSyllabus = getVal(r, 1) || examNameDatesheet;
                    foundSyllabusExam = true;
                    break;
                }
            }
            if (!foundSyllabusExam) {
                examNameSyllabus = getVal(49, 1) || examNameDatesheet;
            }
        }

        // Date Sheet Parser
        function parseDateSheet() {
            parsedDatesheetData = {};

            let headerRowIdx = 1;
            for (let r = 0; r <= 3; r++) {
                for (let c = 1; c <= 15; c++) {
                    const val = getVal(r, c).toLowerCase();
                    if (val.includes("nur") || val.includes("1st") || val.includes("6th") || val.includes("lkg")) {
                        headerRowIdx = r;
                        break;
                    }
                }
            }

            const classMap = {};
            for (let c = 1; c <= 15; c++) {
                let cls = getVal(headerRowIdx, c);
                if (cls) {
                    cls = cleanClassName(cls);
                    classMap[c] = cls;
                    if (!parsedDatesheetData[cls]) {
                        parsedDatesheetData[cls] = { minor: [], major: [] };
                    }
                }
            }

            // Minor exams: Rows 4 & 5 (indices 3 & 4)
            for (let r = 3; r <= 4; r++) {
                const date = getVal(r, 0).trim();
                if (!date) continue;
                for (let c in classMap) {
                    const cls = classMap[c];
                    const subject = getVal(r, parseInt(c)).trim();
                    if (subject !== "") {
                        parsedDatesheetData[cls].minor.push({ date, subject });
                    }
                }
            }

            // Major exams / PT exams: Rows 7 to 12 (indices 6 to 11)
            for (let r = 6; r <= 11; r++) {
                const date = getVal(r, 0).trim();
                if (!date) continue;
                for (let c in classMap) {
                    const cls = classMap[c];
                    const subject = getVal(r, parseInt(c)).trim();
                    if (subject !== "") {
                        parsedDatesheetData[cls].major.push({ date, subject });
                    }
                }
            }
        }

        // Syllabus Parser
        // Exact 14-Row Hard-Separation Syllabus Parser
    function parseSyllabus() {
        parsedSyllabusData = {};

        const block1 = [
            { name: "Nursery", subCol: 0, sylCol: 1 },  // A, B
            { name: "LKG",     subCol: 2, sylCol: 3 },  // C, D
            { name: "UKG",     subCol: 4, sylCol: 5 },  // E, F
            { name: "1st",     subCol: 6, sylCol: 7 },  // G, H
            { name: "2nd",     subCol: 8, sylCol: 9 },  // I, J
            { name: "3rd",     subCol: 10, sylCol: 11 },// K, L
            { name: "4th",     subCol: 12, sylCol: 13 },// M, N
            { name: "5th",     subCol: 14, sylCol: 15 } // O, P
        ];

        const block2 = [
            { name: "6th",  subCol: 0, sylCol: 1 },  // A, B
            { name: "7th",  subCol: 2, sylCol: 3 },  // C, D
            { name: "8th",  subCol: 4, sylCol: 5 },  // E, F
            { name: "9th",  subCol: 6, sylCol: 7 },  // G, H
            { name: "10th", subCol: 8, sylCol: 9 },  // I, J
            { name: "11th", subCol: 10, sylCol: 11 },// K, L
            { name: "12th", subCol: 12, sylCol: 13 } // M, N
        ];

        // Initialize empty arrays
        block1.forEach(b => parsedSyllabusData[b.name] = []);
        block2.forEach(b => parsedSyllabusData[b.name] = []);

        // 1. Locate Row 50: "Test/Exam Name"
        let examRow = -1;
        for (let r = 0; r < matrix.length; r++) {
            const val = getVal(r, 0).toLowerCase();
            if (val.includes("test") || val.includes("exam name")) {
                examRow = r;
                break;
            }
        }
        if (examRow === -1) examRow = 49;

        const sylExam = getVal(examRow, 1);
        examNameSyllabus = sylExam || "Examination";

        // 2. Locate Row 51: Nursery Header Row (where Col B is "Nursery")
        let nurseryHeaderRow = -1;
        for (let r = examRow; r < examRow + 5 && r < matrix.length; r++) {
            const c0 = getVal(r, 0).toLowerCase();
            const c1 = getVal(r, 1).toLowerCase();
            if (c1.includes("nursery") || (c0 === "class" && c1 !== "")) {
                nurseryHeaderRow = r;
                break;
            }
        }
        if (nurseryHeaderRow === -1) nurseryHeaderRow = examRow + 1;

        // 3. Locate Row 67: 6th Header Row (where Col B is "6th" and Col A is "Class")
        // Start looking right after Nursery header row
        let sixthHeaderRow = -1;
        for (let r = nurseryHeaderRow + 2; r < matrix.length; r++) {
            const c0 = getVal(r, 0).toLowerCase();
            const c1 = getVal(r, 1).toLowerCase();
            if (c1 === "6th" || c1.includes("6th") || (c0 === "class" && c1.includes("6"))) {
                sixthHeaderRow = r;
                break;
            }
        }

        // If not found dynamically, default to 16 rows after Nursery
        if (sixthHeaderRow === -1) sixthHeaderRow = nurseryHeaderRow + 16;

        // -------------------------------------------------------------
        // BLOCK 1: Nursery to 5th (Sheet Rows 53 to 66)
        // Starts 2 rows below Nursery (skipping Subject/Syllabus row 52)
        // Strictly stops BEFORE sixthHeaderRow (Row 67)
        // -------------------------------------------------------------
        const b1Start = nurseryHeaderRow + 2;
        const b1End = sixthHeaderRow - 1;

        block1.forEach(item => {
            for (let r = b1Start; r <= b1End; r++) {
                if (r >= matrix.length) break;

                const subject = getVal(r, item.subCol).trim();
                const syllabus = getVal(r, item.sylCol).trim();
                const subLower = subject.toLowerCase();

                // If column A hits "Class" or "Subject" (the header of 6th), STOP immediately!
                if (subLower === "class" || subLower === "subject") break;

                if (subject !== "" || syllabus !== "") {
                    parsedSyllabusData[item.name].push({
                        subject: subject,
                        syllabus: syllabus
                    });
                }
            }
        });

        // -------------------------------------------------------------
        // BLOCK 2: 6th to 12th (Sheet Rows 69 to 82)
        // Starts 2 rows below sixthHeaderRow (Row 69, skipping Subject/Syllabus row 68)
        // Exactly 14 data rows max (up to Row 82)
        // -------------------------------------------------------------
        const b2Start = sixthHeaderRow + 2;
        const b2End = b2Start + 13;

        block2.forEach(item => {
            for (let r = b2Start; r <= b2End; r++) {
                if (r >= matrix.length) break;

                const subject = getVal(r, item.subCol).trim();
                const syllabus = getVal(r, item.sylCol).trim();
                const subLower = subject.toLowerCase();

                // Stop immediately if reaching Row 83 ("END") or "Homework"
                if (subLower === "end" || subLower === "homework" || subLower.startsWith("date")) {
                    break;
                }

                // Skip any stray accidental header
                if (subLower === "class" || subLower === "subject" || subLower === "syllabus") {
                    continue;
                }

                if (subject !== "" || syllabus !== "") {
                    parsedSyllabusData[item.name].push({
                        subject: subject,
                        syllabus: syllabus
                    });
                }
            }
        });
    }
        
        function populateDropdown() {
            const select = document.getElementById('classSelect');
            const previousVal = select.value;
            select.innerHTML = '';

            const dataSource = currentMode === 'datesheet' ? parsedDatesheetData : parsedSyllabusData;
            const classes = Object.keys(dataSource);

            if (classes.length === 0) {
                select.innerHTML = '<option value="">No Classes Found</option>';
                renderCard();
                return;
            }

            classes.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.innerText = `Class ${cls}`;
                select.appendChild(opt);
            });

            if (previousVal && classes.includes(previousVal)) {
                select.value = previousVal;
            } else {
                select.selectedIndex = 0;
            }

            renderCard();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnTabDatesheet').className = mode === 'datesheet' ? 'active' : '';
            document.getElementById('btnTabSyllabus').className = mode === 'syllabus' ? 'active' : '';

            const content = document.getElementById('cardContent');
            if (mode === 'syllabus') {
                content.classList.add('syllabus-mode');
            } else {
                content.classList.remove('syllabus-mode');
            }

            populateDropdown();
        }

        function renderCard() {
            const selectedClass = document.getElementById('classSelect').value;
            const tbody = document.getElementById('tableBody');
            const thCol1 = document.getElementById('thCol1');
            const thCol2 = document.getElementById('thCol2');
            const banner = document.getElementById('bannerLabel');

            document.getElementById('selectedClassLabel').innerText = `Class : ${selectedClass || '---'}`;
            tbody.innerHTML = '';

            if (!selectedClass) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No class selected.</td></tr>`;
                return;
            }

            if (currentMode === 'datesheet') {
                thCol1.innerText = "Date";
                thCol2.innerText = "Subject";
                banner.innerText = `Date Sheet: ${examNameDatesheet}`;

                const data = parsedDatesheetData[selectedClass] || { minor: [], major: [] };
                
                const cleanExamName = examNameDatesheet.toLowerCase().trim();
                const isPTExam = cleanExamName.startsWith("pt") || 
                                 cleanExamName.includes("periodic") || 
                                 cleanExamName.includes("unit test") ||
                                 cleanExamName.includes("term");

                if (isPTExam) {
                    const ptRows = data.major.filter(item => item.date.trim() !== "" && item.subject.trim() !== "");

                    if (ptRows.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No date sheet found for Class ${selectedClass}.</td></tr>`;
                        return;
                    }

                    ptRows.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="col-left-td">${item.date}</td>
                                <td class="col-right-td">${item.subject}</td>
                            </tr>
                        `;
                    });
                } else {
                    if (data.minor.length === 0 && data.major.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No date sheet found for Class ${selectedClass}.</td></tr>`;
                        return;
                    }

                    if (data.minor.length > 0) {
                        tbody.innerHTML += `<tr class="section-header-row"><td colspan="2">MINOR EXAMS</td></tr>`;
                        data.minor.forEach(item => {
                            tbody.innerHTML += `
                                <tr>
                                    <td class="col-left-td">${item.date}</td>
                                    <td class="col-right-td">${item.subject}</td>
                                </tr>
                            `;
                        });
                    }

                    if (data.major.length > 0) {
                        tbody.innerHTML += `<tr class="section-header-row"><td colspan="2">MAJOR EXAMS</td></tr>`;
                        data.major.forEach(item => {
                            tbody.innerHTML += `
                                <tr>
                                    <td class="col-left-td">${item.date}</td>
                                    <td class="col-right-td">${item.subject}</td>
                                </tr>
                            `;
                        });
                    }
                }

            } else {
                // Syllabus Mode
                thCol1.innerText = "Subject";
                thCol2.innerText = "Syllabus";
                banner.innerText = `Syllabus: ${examNameSyllabus}`;

                const items = parsedSyllabusData[selectedClass] || [];

                if (items.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No syllabus entered for Class ${selectedClass}.</td></tr>`;
                    return;
                }

                items.forEach(item => {
                    let formattedSyllabus = item.syllabus;
                    if (formattedSyllabus !== "---") {
                        // Preserves exact formatting/bullets/numbering from sheet without adding any extra bullets
                        formattedSyllabus = formattedSyllabus
                            .split('\n')
                            .map(line => line.trim())
                            .filter(line => line.length > 0)
                            .join('\n');
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td class="col-left-td">${item.subject || '---'}</td>
                            <td class="col-right-td">${formattedSyllabus}</td>
                        </tr>
                    `;
                });
            }
        }

        function downloadImage() {
            const container = document.getElementById('cardContainer');
            const selectedClass = document.getElementById('classSelect').value;
            const prefix = currentMode === 'datesheet' ? 'DateSheet' : 'Syllabus';

            html2canvas(container, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const imageURI = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                link.download = `${prefix}_Class_${selectedClass}.png`;
                link.href = imageURI;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                console.error("Image generation failed:", err);
                alert("Could not generate image. Please try again.");
            });
        }

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
