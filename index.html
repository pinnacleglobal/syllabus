<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinnacle Syllabus Portal</title>
  
  <link rel="icon" type="image/png" href="logo.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* Card is strictly budgeted for single mobile screen view and crisp export */
    #poster-area {
      width: 440px;
      height: fit-content;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fixed table proportions that prevent html2canvas clipping */
    .table-layout {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    .table-row-item {
      display: table-row;
    }
    .col-subj {
      display: table-cell;
      width: 155px;
      vertical-align: middle;
    }
    .col-syl {
      display: table-cell;
      width: 285px;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 flex flex-col items-center">

  <!-- TOP TOOLBAR -->
  <div class="w-full max-w-[440px] bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-3 space-y-2">
    <div class="flex items-center gap-2">
      <label class="text-xs font-bold text-slate-600 uppercase shrink-0">Class:</label>
      <select id="classDropdown" onchange="renderPoster()" class="flex-grow border border-slate-300 rounded-lg p-1.5 bg-slate-50 font-bold text-slate-800 text-sm">
        <option value="Nursery">Nursery</option>
        <option value="LKG">LKG</option>
        <option value="UKG">UKG</option>
        <option value="1st">1st</option>
        <option value="2nd">2nd</option>
        <option value="3rd">3rd</option>
        <option value="4th">4th</option>
        <option value="5th">5th</option>
        <option value="6th">6th</option>
        <option value="7th">7th</option>
        <option value="8th">8th</option>
        <option value="9th">9th</option>
        <option value="10th">10th</option>
        <option value="11th">11th</option>
        <option value="12th">12th</option>
      </select>
      <button onclick="loadGoogleSheetData()" title="Refresh Data" class="border border-[#072448] text-[#072448] px-2.5 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-50">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button onclick="downloadPNG()" class="bg-[#ff7b25] text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-orange-600 shadow flex items-center gap-1">
        <i class="fa-solid fa-download"></i> Save
      </button>
    </div>
  </div>

  <!-- POSTER CANVAS -->
  <div id="poster-area" class="border-4 border-[#072448] rounded-3xl p-4 shadow-xl bg-white text-slate-800">
    
    <!-- HEADER -->
    <div class="flex flex-col items-center text-center">
      
      <!-- Logo (Original Big Emblem) -->
      <img src="logo.png" alt="Pinnacle School" class="w-24 h-24 object-contain mb-2 drop-shadow" onerror="this.style.display='none'"/>

      <!-- Class Badge -->
      <div class="w-full bg-[#0b5cbe] text-white rounded-xl py-1.5 shadow-sm text-center">
        <span id="txtClass" class="text-lg font-black tracking-wider uppercase">Class : 7th</span>
      </div>

      <!-- Exam Name Ribbon (Forced Single Line) -->
      <div class="w-full bg-[#d49e24] text-slate-900 rounded-lg py-1 px-2 mt-1.5 shadow-sm text-center">
        <div id="txtExam" class="font-extrabold text-[13px] tracking-tight uppercase whitespace-nowrap overflow-hidden">
          Syllabus : Half Yearly Examination
        </div>
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="w-full mt-3 border-2 border-[#072448] rounded-xl overflow-hidden shadow-sm">
      
      <!-- Table Header -->
      <div class="table-layout bg-[#072448] text-white font-bold py-2 text-xs uppercase tracking-wider">
        <div class="table-row-item">
          <div class="col-subj text-center border-r border-[#1a3a63] py-1.5">
            <i class="fa-solid fa-book-bookmark text-amber-400 mr-1"></i> SUBJECT
          </div>
          <div class="col-syl text-center py-1.5">
            <i class="fa-solid fa-list-check text-amber-400 mr-1"></i> SYLLABUS
          </div>
        </div>
      </div>

      <!-- Table Body Container -->
      <div id="syllabusContainer" class="table-layout divide-y divide-slate-200 bg-white">
        <!-- Injected via JavaScript -->
      </div>

    </div>

  </div>

  <script>
    // --------------------------------------------------------------------------
    // PASTE YOUR PUBLISHED "SYLLABUS" SHEET CSV URL BELOW:
    // --------------------------------------------------------------------------
    const SYLLABUS_CSV_URL = "PASTE_YOUR_SYLLABUS_PUBLISHED_CSV_URL_HERE";

    // Dynamic icon generator: Hindi has "अ", English has "ABC", Sanskrit has "सं"
    function getSubjectIconHtml(subjectName) {
      const s = subjectName.trim().toUpperCase();
      
      if (s === 'HINDI') {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] font-bold text-xs shrink-0">अ</div>`;
      }
      if (s === 'ENGLISH') {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] font-bold text-[9px] shrink-0">ABC</div>`;
      }
      if (s === 'SANSKRIT') {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] font-bold text-xs shrink-0">सं</div>`;
      }
      if (s.includes('MATH')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-calculator"></i></div>`;
      }
      if (s.includes('SCIENCE')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-flask"></i></div>`;
      }
      if (s.includes('S.ST') || s.includes('SOCIAL')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-landmark"></i></div>`;
      }
      if (s.includes('COMP')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-laptop"></i></div>`;
      }
      if (s.includes('G.K') || s.includes('GK')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-lightbulb"></i></div>`;
      }
      if (s.includes('DRAW') || s.includes('ART')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-palette"></i></div>`;
      }
      if (s.includes('M.V') || s.includes('VALUE')) {
        return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-heart"></i></div>`;
      }

      return `<div class="w-7 h-7 rounded-full border-2 border-[#072448] flex items-center justify-center text-[#072448] text-[10px] shrink-0"><i class="fa-solid fa-book"></i></div>`;
    }

    let parsedData = {
      examName: "Half Yearly Examination",
      classes: {}
    };

    function loadGoogleSheetData() {
      if (!SYLLABUS_CSV_URL || SYLLABUS_CSV_URL === "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtxGSVQwiqW5qdyeE-QtsIKVGxZuEir64DQMdG_70qBZ6zgAKCOsJAUg7rivXTwqDbctkF1Mh7gZOA/pub?gid=1915322612&single=true&output=csv") {
        renderPlaceholder();
        return;
      }

      Papa.parse(SYLLABUS_CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: false,
        complete: function(results) {
          const rows = results.data;
          if (!rows || rows.length < 4) return;

          // Exam title from B1 (Row index 0, Col index 1)
          if (rows[0] && rows[0][1]) {
            parsedData.examName = rows[0][1].trim();
          }

          parsedData.classes = {};

          // Band 1: Nursery to 5th (Cols A-P: 0 to 15, Rows 4 to 17: index 3 to 16, Class header Row 2: index 1)
          parseBand(rows, 1, 3, 16, 0, 15);

          // Band 2: 6th to 12th (Cols A-N: 0 to 13, Rows 20 to 33: index 19 to 32, Class header Row 18: index 17)
          if (rows.length > 18) {
            parseBand(rows, 17, 19, 32, 0, 13);
          }

          renderPoster();
        },
        error: function(err) {
          console.error("CSV parse error:", err);
          renderPlaceholder();
        }
      });
    }

    function parseBand(rows, classRowIdx, dataStartIdx, dataEndIdx, startCol, endCol) {
      for (let col = startCol; col <= endCol; col += 2) {
        if (!rows[classRowIdx] || !rows[classRowIdx][col + 1]) continue;
        const className = rows[classRowIdx][col + 1].trim();
        if (!className) continue;

        const subjectList = [];
        for (let r = dataStartIdx; r <= dataEndIdx && r < rows.length; r++) {
          const rowData = rows[r];
          if (!rowData) continue;
          const subject = (rowData[col] || "").trim();
          const syllabus = (rowData[col + 1] || "").trim();
          if (subject !== "") {
            subjectList.push({ subject: subject, syllabus: syllabus });
          }
        }
        parsedData.classes[className] = subjectList;
      }
    }

    function renderPoster() {
      const cls = document.getElementById("classDropdown").value;
      document.getElementById("txtClass").innerText = "Class : " + cls;
      
      const examTitle = "Syllabus : " + (parsedData.examName || "Half Yearly Examination");
      const examElem = document.getElementById("txtExam");
      examElem.innerText = examTitle;

      // Dynamic font size reduction if exam title is particularly long
      if (examTitle.length > 30) {
        examElem.style.fontSize = "11px";
      } else {
        examElem.style.fontSize = "13px";
      }

      const container = document.getElementById("syllabusContainer");
      container.innerHTML = "";

      let subjects = parsedData.classes[cls];
      if (!subjects) {
        const key = Object.keys(parsedData.classes).find(k => k.toLowerCase() === cls.toLowerCase());
        if (key) subjects = parsedData.classes[key];
      }

      if (!subjects || subjects.length === 0) {
        container.innerHTML = `
          <div class="table-row-item">
            <div colspan="2" class="p-4 text-center text-slate-400 font-medium text-xs">
              No entries found in Google Sheet for ${cls}.
            </div>
          </div>`;
        return;
      }

      subjects.forEach(item => {
        const iconHtml = getSubjectIconHtml(item.subject);

        // Supports multi-line syllabus text gracefully
        const bullets = item.syllabus
          .split('\n')
          .filter(l => l.trim() !== '')
          .map(l => `<div class="leading-tight">${l.startsWith('•') ? l : '• ' + l}</div>`)
          .join('');

        const row = `
          <div class="table-row-item">
            <!-- Subject Column: Dedicated width, icon + full title visible without ellipses -->
            <div class="col-subj p-2 border-r border-slate-200">
              <div class="flex items-center gap-1.5">
                ${iconHtml}
                <span class="font-extrabold text-[#072448] text-xs uppercase leading-tight whitespace-normal">
                  ${item.subject}
                </span>
              </div>
            </div>
            <!-- Syllabus Column: Full multi-line display -->
            <div class="col-syl p-2 pl-3 text-[11px] font-semibold text-slate-800 space-y-0.5 whitespace-normal">
              ${bullets || '—'}
            </div>
          </div>
        `;
        container.innerHTML += row;
      });
    }

    function renderPlaceholder() {
      parsedData.classes["7th"] = [
        { subject: "English", syllabus: "• Chapter 1 to 5 Reader\n• Grammar: Nouns, Verbs, Tenses\n• Notice Writing & Comprehension" },
        { subject: "Hindi", syllabus: "• पाठ 1 से 6\n• व्याकरण: संधि, समास\n• पत्र लेखन" },
        { subject: "Maths", syllabus: "• Ch 1: Integers\n• Ch 2: Fractions & Decimals\n• Ch 3: Data Handling" }
      ];
      renderPoster();
    }

    function downloadPNG() {
      const node = document.getElementById("poster-area");
      const cls = document.getElementById("classDropdown").value;

      html2canvas(node, {
        scale: 3, // High-resolution output
        useCORS: true,
        backgroundColor: "#ffffff",
        scrollX: 0,
        scrollY: 0
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = `Syllabus_${cls}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    window.onload = loadGoogleSheetData;
  </script>
</body>
</html>
